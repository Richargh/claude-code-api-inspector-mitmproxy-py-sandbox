[project]
name = "claude-inspector"
version = "0.1.0"
description = "Inspect HTTP traffic between Claude Code and Anthropic API using mitmproxy"
requires-python = ">=3.14"
dependencies = [
    "mitmproxy==12.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.1",
    "pytest-cov==7.0.0",
    "ruff==0.14.6",
    "mypy==1.18.2",
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "test"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
strict_optional = true